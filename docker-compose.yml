version: '3.8'

# ==========================================
# 1. CẤU HÌNH CHUNG CHO AIRFLOW (DRY Principle)
# ==========================================
x-airflow-common:
  &airflow-common
  build: ./airflow
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_DEFAULT_REGION: us-east-1
    AIRFLOW_CONN_AWS_DEFAULT: aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@?host=http%3A%2F%2Fminio%3A9000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./data_generator:/opt/airflow/data_generator
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ==========================================
  # 2. METADATA DATABASE (Postgres)
  # ==========================================
  postgres:
    image: postgres:13
    container_name: postgres_metadata
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    restart: always

  # ==========================================
  # 3. DATA LAKE STORAGE (MinIO S3)
  # ==========================================
  minio:
    image: minio/minio
    container_name: minio_s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==========================================
  # 4. ORCHESTRATION (Airflow Services)
  # ==========================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__WORKERS: 2  # Thêm dòng này để giảm tải RAM  
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 5. PROCESSING LAYER (Spark Cluster)
  # ==========================================
  spark-master:
    build: ./docker/spark
    user: root
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_SECRET=${SPARK_RPC_AUTHENTICATION_SECRET}
    ports:
      - "9090:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data_generator:/opt/spark/work-dir/data_generator
      - ./warehouse:/user/hive/warehouse
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    build: ./docker/spark
    user: root
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_SECRET=${SPARK_RPC_AUTHENTICATION_SECRET}
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data_generator:/opt/spark/work-dir/data_generator
      - ./warehouse:/user/hive/warehouse
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # ==========================================
  # 6. DATA WAREHOUSE LAYER (Hive Ecosystem)
  # ==========================================
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    restart: always
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
    volumes:
      - ./warehouse:/user/hive/warehouse
      - ./drivers/postgresql-42.2.25.jar:/opt/hive/lib/postgresql-42.2.25.jar
    depends_on:
      - postgres
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo '⏳ Đợi Postgres 10s...';
        sleep 10;
        
        echo '🛠 Init Schema (Ép buộc dùng Postgres)...';
        /opt/hive/bin/schematool -dbType postgres -initSchema -url "jdbc:postgresql://postgres:5432/metastore_db?createDatabaseIfNotExist=true" -userName airflow -passWord airflow --verbose || echo '✅ Schema already exists!';
        
        echo '🚀 Khởi động Hive Metastore...';
        # Móc thư viện AWS S3 từ Hadoop vào cho Hive
        export HADOOP_CLASSPATH=/opt/hadoop/share/hadoop/tools/lib/*:$HADOOP_CLASSPATH
        
        # Nhét toàn bộ cấu hình Postgres và MinIO trực tiếp vào lệnh chạy
        exec /opt/hive/bin/hive --service metastore \
          --hiveconf javax.jdo.option.ConnectionURL="jdbc:postgresql://postgres:5432/metastore_db?createDatabaseIfNotExist=true" \
          --hiveconf javax.jdo.option.ConnectionDriverName=org.postgresql.Driver \
          --hiveconf javax.jdo.option.ConnectionUserName=airflow \
          --hiveconf javax.jdo.option.ConnectionPassword=airflow \
          --hiveconf fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
          --hiveconf fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
          --hiveconf fs.s3a.endpoint=http://minio:9000 \
          --hiveconf fs.s3a.access.key=minio_admin \
          --hiveconf fs.s3a.secret.key=minio_password_secure_123 \
          --hiveconf fs.s3a.path.style.access=true

  hive-server:
    image: apache/hive:3.1.3  # Trở lại dùng image gốc
    container_name: hive-server
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_SITE_CONF_hive_metastore_uris: "thrift://hive-metastore:9083"
    ports:
      - "10000:10000"
    depends_on:
      - hive-metastore
    volumes:
      - ./warehouse:/user/hive/warehouse
      - ./drivers/postgresql-42.2.25.jar:/opt/hive/lib/postgresql-42.2.25.jar

# ==========================================
  # 7. QUERY & SERVING LAYER (Trino)
  # ==========================================
  trino-coordinator:
    image: trinodb/trino:latest
    container_name: trino-coordinator
    ports:
      - "8081:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1G
    depends_on:
      - minio
      - hive-metastore

# ==========================================
# 8. VOLUMES (Lưu trữ vĩnh viễn)
# ==========================================
volumes:
  postgres_data:
  minio_data:         